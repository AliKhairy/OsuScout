name: Release

# CI runs on every push. This runs only when you push a version tag:
#
#     git tag 1.0.8 && git push origin 1.0.8
#
# The tag is the release trigger and the source of the version number, so there
# is exactly one place a version is declared. Pattern matches the existing tag
# convention (1.0.7, no leading "v").
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

# CI only needs to read the repo. This job PUBLISHES, so it needs write access
# to create the release and upload assets. That difference is the reason the two
# workflows are separate files rather than one with an if - a workflow that can
# publish is a bigger target, so it should run as rarely as possible.
permissions:
  contents: write

jobs:
  release:
    name: Build, package and publish
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from the tag
        id: version
        run: |
          # github.ref_name is the tag that triggered this run, e.g. "1.0.8".
          # Velopack requires a plain semver string, which is why the tag
          # pattern above is strict about the format.
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${GITHUB_REF_NAME}"

      # Refuse to publish a version that already exists. Velopack clients use
      # the version to decide whether to update, so silently replacing the
      # assets under an existing tag would leave users stranded on whatever
      # they downloaded first, with no error anywhere.
      - name: Check the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists. Bump the version and tag again."
            exit 1
          fi

      - name: Restore
        run: dotnet restore OsuScoutNew/OsuScoutNew.csproj

      # Self-contained: bundles the .NET runtime into the output, so users do
      # not have to install .NET first. It is why the existing releases are
      # ~180 MB, and changing it would break every installed copy.
      - name: Publish
        run: |
          dotnet publish OsuScoutNew/OsuScoutNew.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o publish

      # Fail early and loudly if the ONNX models are missing from the build
      # output. Without them the app installs fine and then cannot classify
      # anything - a failure users would hit, not CI. They are copied via
      # CopyToOutputDirectory in the csproj, which is easy to break by accident.
      - name: Verify model assets are present
        run: |
          missing=0
          for i in 1 2 3 4 5; do
            if [ ! -f "publish/Assets/ensemble_model_${i}.onnx" ]; then
              echo "Missing publish/Assets/ensemble_model_${i}.onnx"
              missing=1
            fi
          done
          if [ ! -f "publish/Assets/model_config.json" ]; then
            echo "Missing publish/Assets/model_config.json"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "All 5 ONNX models and model_config.json are present."

      # Pinned to the Velopack version in the csproj. The packaging tool and the
      # runtime library have to agree on the package format, so letting this
      # float would eventually produce packages the installed app cannot read.
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 0.0.866

      - name: Package
        run: |
          vpk pack \
            --packId OsuScoutNew \
            --packVersion "${{ steps.version.outputs.version }}" \
            --packDir publish \
            --mainExe OsuScoutNew.exe

      # vpk builds the delta package by diffing against the previous release, so
      # existing users download a few MB instead of 180. Uploading through vpk
      # rather than `gh release create` is what keeps RELEASES and
      # releases.win.json - the files the updater actually reads - consistent.
      - name: Publish GitHub Release
        run: |
          vpk upload github \
            --repoUrl https://github.com/AliKhairy/OsuScout \
            --token "${{ github.token }}" \
            --tag "${{ steps.version.outputs.version }}" \
            --releaseName "OsuScout ${{ steps.version.outputs.version }}" \
            --publish

      # Keep the packaged output even when a later step fails, so a broken
      # release can be inspected without reproducing the whole build locally.
      - name: Upload packages as a build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velopack-packages-${{ steps.version.outputs.version }}
          path: Releases/
          if-no-files-found: warn
          retention-days: 14
