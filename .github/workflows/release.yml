name: Release

# Releases are driven by one line in OsuScoutNew/OsuScoutNew.csproj:
#
#     <Version>1.1.1</Version>
#
# Bump it in a PR. When that PR merges, this workflow sees a version that has no
# release yet and ships it. Merges that don't change the version only run CI.
# So the decision "this ships" is a visible line in a reviewed diff, and the
# version is declared in exactly one place.
#
# Why not "merge -> a workflow pushes a tag -> the tag triggers the release"?
# Anything a workflow does with its own GITHUB_TOKEN does not trigger other
# workflows (GitHub's guard against workflows endlessly triggering each other),
# so a tag pushed that way would never start a release. The release has to
# happen here, in the run the merge itself started.
#
# It can also be run by hand from the Actions tab as a dry run: it builds,
# verifies and packages exactly as a real release does, then stops before
# uploading. Nothing reaches users. Use it to prove a change to this file works
# before merging it.
on:
  push:
    branches: [main]
    # The version lives in the csproj, so a push that doesn't touch it cannot be
    # a release. Filtering here skips the run entirely instead of spinning up a
    # runner just to find there is nothing to do.
    paths: ['OsuScoutNew/OsuScoutNew.csproj']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (dry run only, e.g. 9.9.9-dryrun)'
        required: true
        default: '9.9.9-dryrun'

# CI only needs to read the repo. This job PUBLISHES, so it needs write access
# to create the release and upload assets. That difference is the reason the two
# workflows are separate files rather than one with an if - a workflow that can
# publish is a bigger target, so it should run as rarely as possible.
permissions:
  contents: write

# Two version bumps merged in quick succession must not publish side by side.
# Queue them instead. Unlike CI, never cancel an older run: cancelling a release
# halfway through upload could leave a half-published release that users see.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Deciding is cheap, building is not. This runs on Linux in seconds; the
  # Windows build job below only starts if there is something to ship.
  decide:
    name: Is there a new version to ship?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
      build: ${{ steps.decide.outputs.build }}

    steps:
      - uses: actions/checkout@v7

      # Every later step reads these outputs rather than re-deriving the
      # condition, so there is one place that decides "are we shipping".
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          # Name the repo explicitly rather than relying on gh reading it from
          # the checked-out .git folder.
          GH_REPO: ${{ github.repository }}
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "version=${DRY_RUN_VERSION}" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "DRY RUN: ${DRY_RUN_VERSION} - builds and packages, publishes nothing."
            exit 0
          fi

          # Pull the text between <Version> and </Version> out of the csproj.
          version=$(grep -o '<Version>[^<]*</Version>' OsuScoutNew/OsuScoutNew.csproj | sed 's/<[^>]*>//g')

          # Velopack needs plain MAJOR.MINOR.PATCH. Catching a typo here is far
          # better than catching it after users have downloaded it.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::<Version> in OsuScoutNew.csproj is '${version}', expected e.g. 1.2.3"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

          # Every released version, in one API call. This must FAIL CLOSED: if
          # the call errors (network, auth, rate limit), the step fails here and
          # nothing ships. Asking "does release X exist?" and reading an error as
          # "no" would publish on every GitHub hiccup.
          released=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')

          # Already released: the csproj changed for some other reason (e.g. a
          # package update). Not an error - there is just nothing to ship. Never
          # re-upload an existing version either: users who already have it would
          # never be offered the replacement.
          if grep -qxF "$version" <<< "$released"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "${version} is already released - nothing to ship."
            exit 0
          fi

          # Velopack only ever updates users to a HIGHER version. Publishing a
          # lower one would become GitHub's "latest" release while no installed
          # copy would ever take it. sort -V orders version numbers correctly
          # (1.10.0 after 1.9.0). Old "v1.0.2"-style tags are ignored.
          highest_released=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$released" | sort -V | tail -n 1 || true)
          if [ -n "$highest_released" ]; then
            highest=$(printf '%s\n%s\n' "$highest_released" "$version" | sort -V | tail -n 1)
            if [ "$highest" != "$version" ]; then
              echo "::error::${version} is not higher than the latest release ${highest_released}. Bump <Version> past it."
              exit 1
            fi
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "REAL RELEASE: ${highest_released:-none} -> ${version} - this will reach users."

  release:
    name: Build, package and publish
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OsuScoutNew/OsuScoutNew.csproj

      # Self-contained: bundles the .NET runtime into the output, so users do
      # not have to install .NET first. It is why the existing releases are
      # ~180 MB, and changing it would break every installed copy.
      - name: Publish
        run: |
          dotnet publish OsuScoutNew/OsuScoutNew.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o publish

      # Fail early and loudly if the ONNX models are missing from the build
      # output. Without them the app installs fine and then cannot classify
      # anything - a failure users would hit, not CI. They are copied via
      # CopyToOutputDirectory in the csproj, which is easy to break by accident.
      - name: Verify model assets are present
        run: |
          missing=0
          for i in 1 2 3 4 5; do
            if [ ! -f "publish/Assets/ensemble_model_${i}.onnx" ]; then
              echo "Missing publish/Assets/ensemble_model_${i}.onnx"
              missing=1
            fi
          done
          if [ ! -f "publish/Assets/model_config.json" ]; then
            echo "Missing publish/Assets/model_config.json"
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "All 5 ONNX models and model_config.json are present."

      # Pinned to the Velopack version in the csproj. The packaging tool and the
      # runtime library have to agree on the package format, so letting this
      # float would eventually produce packages the installed app cannot read.
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 0.0.866-g70566a3

      - name: Package
        run: |
          vpk pack \
            --packId OsuScoutNew \
            --packVersion "${{ needs.decide.outputs.version }}" \
            --packDir publish \
            --mainExe OsuScoutNew.exe

      # Uploading through vpk rather than `gh release create` is what keeps
      # RELEASES and releases.win.json - the files the updater actually reads -
      # consistent. No delta package yet: vpk can only diff against a previous
      # release that is in Releases/ locally, and this runner starts empty, so
      # users download the full package on every update.
      # --targetCommitish puts the new tag on the exact commit this run built.
      # Without it GitHub tags whatever main points at when the upload finishes,
      # which is a different commit if something else merged mid-build.
      # THE ONLY STEP THAT REACHES USERS. Everything above runs identically in a
      # dry run; this is the single line of difference between rehearsal and
      # release, which is what makes the rehearsal worth trusting.
      - name: Publish GitHub Release
        if: needs.decide.outputs.dry_run == 'false'
        run: |
          vpk upload github \
            --repoUrl https://github.com/AliKhairy/OsuScout \
            --token "${{ github.token }}" \
            --tag "${{ needs.decide.outputs.version }}" \
            --targetCommitish "${GITHUB_SHA}" \
            --releaseName "OsuScout ${{ needs.decide.outputs.version }}" \
            --publish

      - name: Dry run summary
        if: needs.decide.outputs.dry_run == 'true'
        run: |
          echo "Dry run complete - nothing was published."
          echo "Packages built:"
          ls -lh Releases/
          echo "Download them from the Artifacts section of this run to inspect."

      # Keep the packaged output even when a later step fails, so a broken
      # release can be inspected without reproducing the whole build locally.
      # This is also how a dry run's packages get off the runner.
      - name: Upload packages as a build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: velopack-packages-${{ needs.decide.outputs.version }}
          path: Releases/
          if-no-files-found: warn
          retention-days: 14
